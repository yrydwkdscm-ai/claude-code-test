<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>scene</title>
<style>
  @font-face {
    font-family: "NotoSansJP-Bold";
    src: url("__FONT_BOLD_URL__") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "NotoSansJP-Black";
    src: url("__FONT_BLACK_URL__") format("woff2");
    font-weight: 900;
    font-display: block;
  }

  :root {
    --bg-1: #14141c;
    --bg-2: #05050a;
    --fg: #eef0f5;
    --fg-dim: #9aa0b4;
    --gold-1: #ffe9a8;
    --gold-2: #ffb300;
    --glow: rgba(255, 191, 71, 0.45);
    --caution: #ffb37a;
    --bar: rgba(255, 191, 71, 0.85);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg-2);
  }

  body {
    position: relative;
    background:
      radial-gradient(ellipse 900px 900px at 50% 36%, var(--bg-1) 0%, var(--bg-2) 68%);
    font-family: "NotoSansJP-Bold", "Noto Sans CJK JP", sans-serif;
  }

  /* subtle vignette so edges read as "dark", not flat */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 260px 40px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }

  .safe-area {
    position: absolute;
    left: 90px;
    right: 90px;
    top: 300px;
    bottom: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--line-gap, 40px);
  }

  .line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 28px;
    white-space: nowrap;
    line-height: 1.15;
  }

  .role-label {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-label, 66px);
    color: var(--fg);
    letter-spacing: 2px;
  }

  .role-heading {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-heading, 84px);
    color: var(--fg);
    letter-spacing: 1px;
  }

  .role-accent {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-accent, 150px);
    background: linear-gradient(180deg, var(--gold-1) 10%, var(--gold-2) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 46px var(--glow);
    letter-spacing: 1px;
  }

  .role-tag {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-tag, 50px);
    color: var(--fg-dim);
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    padding: 10px 30px;
    letter-spacing: 1px;
  }

  .role-note {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-note, 54px);
    color: var(--fg-dim);
    letter-spacing: 1px;
  }

  .role-caution {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-caution, 46px);
    color: var(--caution);
    letter-spacing: 1px;
  }

  .accent-bar {
    width: 120px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--gold-1), var(--gold-2));
    box-shadow: 0 0 24px var(--glow);
  }
</style>
</head>
<body>
  <div class="safe-area" id="safe-area">__LINES_HTML__</div>

  <script>
    // Uniformly scale down any line that would overflow the safe-area
    // width, so text never runs off the 1080px canvas regardless of
    // hand-tuned font sizes. Runs once, after fonts are ready.
    function fitLines() {
      var safeArea = document.getElementById("safe-area");
      var maxWidth = safeArea.clientWidth;
      var lines = Array.prototype.slice.call(document.querySelectorAll(".line"));

      lines.forEach(function (line) {
        line.style.transform = "none";
        var natural = line.scrollWidth;
        if (natural > maxWidth) {
          var scale = (maxWidth / natural) * 0.96;
          line.style.transformOrigin = "center center";
          line.style.transform = "scale(" + scale.toFixed(4) + ")";
        }
      });

      document.documentElement.setAttribute("data-fit-done", "1");
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitLines);
    } else {
      fitLines();
    }
  </script>
</body>
</html>
