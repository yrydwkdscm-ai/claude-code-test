<!doctype html>
<html lang="ja" style="background:#050308">
<head>
<meta charset="utf-8" />
<title>scene-v6</title>
<style>
  @font-face {
    font-family: "NotoSansJP-Bold";
    src: url("__FONT_BOLD_URL__") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "NotoSansJP-Black";
    src: url("__FONT_BLACK_URL__") format("woff2");
    font-weight: 900;
    font-display: block;
  }

  :root {
    --bg-1: #1a1024;
    --bg-2: #050308;
    --fg: #f5f4fa;
    --gold-1: #ffe9a8;
    --gold-2: #ffb300;
    --glow: rgba(255, 178, 41, 0.55);
    --green: #8dff6b;
    --red: #ff3b3b;
    --pink: #ff6fb0;
    --lamp: rgba(255, 110, 40, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg-2);
  }

  body {
    position: relative;
    font-family: "NotoSansJP-Bold", "Noto Sans CJK JP", sans-serif;
  }

  /* ================= background: the visual stage (layer 4 of 4) ================= */
  .bg-glow {
    position: absolute;
    inset: -20%;
    background: radial-gradient(ellipse 950px 950px at 50% 30%, var(--bg-1) 0%, var(--bg-2) 68%);
    animation: drift 20s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  @keyframes drift {
    0%   { transform: translate(-1.5%, -1%) scale(1.02); }
    100% { transform: translate(1.5%, 1.5%) scale(1.07); }
  }

  .bg-lamp {
    position: absolute;
    left: 50%;
    top: 8%;
    width: 800px;
    height: 800px;
    margin-left: -400px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--lamp), transparent 65%);
    filter: blur(4px);
    animation: lampPulse 1.7s ease-in-out infinite;
    animation-play-state: paused;
  }
  @keyframes lampPulse {
    0%, 100% { opacity: 0.22; transform: scale(0.94); }
    50%      { opacity: 0.55; transform: scale(1.06); }
  }

  .bg-reel {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 90px;
    opacity: 0.5;
    filter: blur(0.4px);
    background:
      repeating-linear-gradient(180deg, rgba(255, 200, 110, 0.16) 0 4px, transparent 4px 90px),
      repeating-radial-gradient(circle at 50% 45px, rgba(255, 214, 130, 0.4) 0 13px, transparent 14px 90px);
    background-size: 100% 180px, 100% 180px;
    animation: reelScroll 1.4s linear infinite;
    animation-play-state: paused;
  }
  .bg-reel.left { left: 0; }
  .bg-reel.right { right: 0; }
  .bg-reel.mid-left { left: 90px; width: 4px; opacity: 0.3; }
  .bg-reel.mid-right { right: 90px; width: 4px; opacity: 0.3; }
  @keyframes reelScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 180px, 0 180px; }
  }
  /* fast spin while the countup is running */
  body.reel-turbo .bg-reel { animation-duration: 0.28s; }
  /* hard freeze at the 80,000,000G arrival / 96.89% reveal -- contrast
     against the turbo spin makes the "stop" read clearly */
  body.reel-stop .bg-reel { animation-play-state: paused !important; }
  /* calmed motion for the "全員勝った？" / "でも…" beats */
  body.calm .bg-reel, body.calm .bg-neon { animation-play-state: paused !important; opacity: 0.18; }

  .bg-neon {
    position: absolute;
    left: 90px;
    right: 90px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
    box-shadow: 0 0 18px 2px var(--glow);
    animation: neonBreathe 2.1s ease-in-out infinite;
    animation-play-state: paused;
    transition: opacity 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
  }
  .bg-neon.top { top: 296px; }
  .bg-neon.bottom { bottom: 296px; }
  @keyframes neonBreathe {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.75; }
  }
  /* -2,816枚 の衝撃を強めるための赤ネオン */
  body.neon-red .bg-neon {
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow: 0 0 22px 3px rgba(255, 59, 59, 0.65);
  }

  .bg-graph {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1080px;
    height: 280px;
    opacity: 0.4;
  }
  .bg-graph path {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 22 14;
    animation: graphFlow 3.4s linear infinite;
    animation-play-state: paused;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .bg-graph path.gv-neutral { stroke: var(--gold-2); }
  .bg-graph path.gv-up      { stroke: var(--green); }
  .bg-graph path.gv-down    { stroke: var(--red); }
  @keyframes graphFlow { to { stroke-dashoffset: -360; } }
  /* momentary freeze synced to the 80,000,000G arrival / 96.89% reveal */
  body.graph-freeze .bg-graph path { animation-play-state: paused !important; }

  .bg-digits {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 280px;
    overflow: hidden;
  }
  .bg-digit {
    position: absolute;
    top: -40px;
    color: rgba(255, 214, 130, 0.5);
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    animation-name: digitFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-play-state: paused;
  }
  @keyframes digitFall {
    0%   { transform: translateY(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(320px); opacity: 0; }
  }
  /* extra-fast stream the instant 8000万G lands */
  body.digits-burst .bg-digit { animation-duration: 0.9s !important; }

  .bg-people {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 760px;
    height: 460px;
    margin: -230px 0 0 -380px;
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 0;
  }
  .bg-person {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(255, 214, 130, 0.4);
    justify-self: center;
    align-self: center;
  }
  .bg-person.lose { background: var(--red); box-shadow: 0 0 10px rgba(255, 59, 59, 0.7); }

  /* per-number decor: soft arrow / gauge, sits behind text, fills the
     center-frame emptiness without adding more copy */
  .decor-layer {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .decor-layer.on { opacity: 1; }
  .decor-arrow {
    width: 520px;
    height: 640px;
  }
  .decor-arrow.arrow-up path { fill: rgba(141, 255, 107, 0.16); }
  .decor-arrow.arrow-down path { fill: rgba(255, 59, 59, 0.2); }
  .decor-gauge circle.track { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 22; }
  .decor-gauge circle.fill {
    fill: none;
    stroke: var(--gold-2);
    stroke-width: 22;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
    filter: drop-shadow(0 0 14px var(--glow));
  }

  body::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 280px 50px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    z-index: 4;
  }

  .dim-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    z-index: 3;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }

  /* whole-viewport impact shake (number settling / arrival beats) */
  .impact-shake { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes shake {
    10%, 90% { transform: translate3d(-3px, 0, 0) scale(1); }
    20%, 80% { transform: translate3d(6px, 0, 0) scale(1); }
    30%, 50%, 70% { transform: translate3d(-11px, 0, 0) scale(1); }
    40%, 60% { transform: translate3d(11px, 0, 0) scale(1); }
    100% { transform: translate3d(0, 0, 0) scale(1); }
  }

  /* ================= scenes ================= */
  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(1.035);
    pointer-events: none;
  }
  .scene.zoomed { transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); transform: scale(1); }

  .safe-area {
    position: absolute;
    left: 90px;
    right: 90px;
    top: 300px;
    bottom: var(--safe-bottom, 300px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--line-gap, 40px);
    z-index: 5;
  }

  .line {
    position: relative;
    display: flex;
    justify-content: center;
    opacity: 0;
    animation: lineFade 0.28s ease-out forwards;
    animation-play-state: paused;
  }
  @keyframes lineFade { from { opacity: 0; } to { opacity: 1; } }
  .line.enter-fadeUp { animation-name: lineFadeUp; }
  @keyframes lineFadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .line.enter-riseUp { animation-name: lineRiseUp; animation-duration: 0.5s; }
  @keyframes lineRiseUp {
    from { opacity: 0; transform: translateY(70px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .line.enter-dropSlam { animation-name: lineDropSlam; animation-duration: 0.5s; animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0); }
  @keyframes lineDropSlam {
    0%   { opacity: 0; transform: translateY(-260px); }
    55%  { opacity: 1; transform: translateY(18px); }
    75%  { opacity: 1; transform: translateY(-8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .line-fit {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 24px;
    white-space: nowrap;
    line-height: 1.16;
    transform-origin: center;
    transform: scale(var(--fit-scale, 1));
  }

  .role-label {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-label, 66px);
    color: var(--fg);
    -webkit-text-stroke: 5px #000;
    paint-order: stroke fill;
    letter-spacing: 2px;
  }
  .role-heading {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-heading, 96px);
    color: var(--fg);
    -webkit-text-stroke: 7px #000;
    paint-order: stroke fill;
    letter-spacing: 1px;
  }
  .role-gold {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-gold, 150px);
    color: var(--gold-1);
    -webkit-text-stroke: 8px #000;
    paint-order: stroke fill;
    text-shadow: 0 0 44px var(--glow);
    letter-spacing: 1px;
  }
  .role-plus {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-plus, 150px);
    color: var(--green);
    -webkit-text-stroke: 8px #000;
    paint-order: stroke fill;
    text-shadow: 0 0 40px rgba(141, 255, 107, 0.5);
    letter-spacing: 1px;
  }
  .role-minus {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-minus, 150px);
    color: var(--red);
    -webkit-text-stroke: 9px #000;
    paint-order: stroke fill;
    text-shadow: 0 0 50px rgba(255, 59, 59, 0.65);
    letter-spacing: 1px;
  }
  .role-taunt {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-taunt, 100px);
    color: var(--fg);
    -webkit-text-stroke: 6px var(--red);
    paint-order: stroke fill;
    letter-spacing: 1px;
  }
  .role-mega {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-mega, 214px);
    color: var(--gold-1);
    -webkit-text-stroke: 11px #000;
    paint-order: stroke fill;
    text-shadow: 0 0 60px var(--glow);
    letter-spacing: 0px;
  }
  .role-note {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-note, 44px);
    color: #c9c6d6;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    letter-spacing: 1px;
  }
  .role-brand {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-brand, 38px);
    color: var(--pink);
    -webkit-text-stroke: 3px #000;
    paint-order: stroke fill;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(255, 111, 176, 0.5);
  }

  .pop-normal, .pop-strong, .pop-hero, .pop-mega, .pop-smooth {
    display: inline-block;
    opacity: 0;
    animation-fill-mode: forwards;
    animation-play-state: paused;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }
  .pop-normal { animation-name: popNormal; animation-duration: 0.42s; }
  .pop-strong { animation-name: popStrong; animation-duration: 0.5s; }
  .pop-hero   { animation-name: popHero;   animation-duration: 0.6s; }
  .pop-mega   { animation-name: popMega;   animation-duration: 0.7s; }
  .pop-smooth { animation-name: popSmooth; animation-duration: 0.65s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes popNormal {
    0%   { opacity: 0; transform: scale(0.86); }
    60%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popStrong {
    0%   { opacity: 0; transform: scale(0.78); }
    55%  { opacity: 1; transform: scale(1.18); }
    80%  { transform: scale(0.96); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popHero {
    0%   { opacity: 0; transform: scale(0.7); }
    50%  { opacity: 1; transform: scale(1.24); }
    75%  { transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popMega {
    0%   { opacity: 0; transform: scale(0.55) rotate(-1.5deg); }
    40%  { opacity: 1; transform: scale(1.32) rotate(0.5deg); }
    60%  { transform: scale(0.92) rotate(-0.3deg); }
    80%  { transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes popSmooth {
    0%   { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* re-triggered (via Web Animations API, not this class) when a countup
     crosses a milestone, and after the 80,000,000G -> 8000万G swap */
  @keyframes quickPulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }

  .glow-burst, .glow-burst-mega {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 820px;
    height: 820px;
    margin: -410px 0 0 -410px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow), transparent 70%);
    opacity: 0;
    transform: scale(0.5);
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    animation-play-state: paused;
    pointer-events: none;
    z-index: -1;
  }
  .glow-burst { animation-name: burst; animation-duration: 0.6s; }
  .glow-burst-mega {
    width: 1200px;
    height: 1200px;
    margin: -600px 0 0 -600px;
    animation-name: burst;
    animation-duration: 0.9s;
  }
  .glow-burst-red { background: radial-gradient(circle, rgba(255, 59, 59, 0.55), transparent 70%); }
  @keyframes burst {
    0%   { opacity: 0; transform: scale(0.5); }
    35%  { opacity: 0.95; }
    100% { opacity: 0; transform: scale(1.7); }
  }

  .countup { font-variant-numeric: tabular-nums; }

  /* ================= Jagumi (layer 2 of 4: character) ================= */
  .jagumi-slot {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }
  .jagumi-slot.mode-hero.side-center { left: 50%; bottom: 30px; transform: translateX(-50%); }
  .jagumi-slot.mode-hero.side-left   { left: 27%; bottom: 30px; transform: translateX(-50%); }
  .jagumi-slot.mode-hero.side-right  { left: 73%; bottom: 30px; transform: translateX(-50%); }
  .jagumi-slot.mode-corner.side-left  { left: 4px; bottom: 56px; }
  .jagumi-slot.mode-corner.side-right { right: 4px; bottom: 56px; }

  .jagumi-bob {
    animation: jgBob 2.6s ease-in-out infinite;
    animation-play-state: paused;
  }
  @keyframes jgBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-16px); }
  }

  .jagumi-img {
    display: block;
    height: var(--jg-size, 300px);
    width: auto;
    filter:
      drop-shadow(0 14px 26px rgba(0, 0, 0, 0.62))
      drop-shadow(0 0 40px rgba(255, 150, 70, 0.3));
    opacity: 0;
    animation-play-state: paused;
    animation-fill-mode: forwards;
  }
  .jagumi-img.enter-pop {
    animation-name: jgPop;
    animation-duration: 0.5s;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .jagumi-img.enter-slideLeft {
    animation-name: jgSlideFromRight;
    animation-duration: 0.55s;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
  }
  .jagumi-img.enter-slideRight {
    animation-name: jgSlideFromLeft;
    animation-duration: 0.55s;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
  }
  .jagumi-img.enter-none {
    animation-name: jgFadeOnly;
    animation-duration: 0.3s;
  }
  @keyframes jgPop {
    0%   { opacity: 0; transform: scale(0.6); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes jgSlideFromRight {
    from { opacity: 0; transform: translateX(160px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes jgSlideFromLeft {
    from { opacity: 0; transform: translateX(-160px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes jgFadeOnly {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* character-only shake (distinct from the whole-screen .impact-shake) */
  .jagumi-slot.jg-shake { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  .jg-qmark {
    position: absolute;
    top: -6px;
    right: -18px;
    font-family: "NotoSansJP-Black", sans-serif;
    font-size: 74px;
    color: var(--fg);
    -webkit-text-stroke: 6px var(--red);
    paint-order: stroke fill;
    opacity: 0;
    animation: qmarkFloat 2.2s ease-in-out infinite, qmarkIn 0.4s ease-out forwards;
    animation-play-state: paused;
  }
  @keyframes qmarkIn { to { opacity: 1; } }
  @keyframes qmarkFloat {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-12px) rotate(6deg); }
  }

  /* small sparkle burst used when jagumi.point is set, to suggest
     "look here" without needing a different pose asset */
  .jg-point-spark {
    position: absolute;
    top: 6%;
    left: 92%;
    width: 46px;
    height: 46px;
    background: radial-gradient(circle, var(--gold-1), transparent 70%);
    border-radius: 50%;
    opacity: 0;
    animation: sparkPulse 1.1s ease-in-out infinite, qmarkIn 0.3s ease-out forwards;
    animation-play-state: paused;
  }
  @keyframes sparkPulse {
    0%, 100% { transform: scale(0.7); opacity: 0.5; }
    50%      { transform: scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-lamp"></div>
  <div class="bg-reel left"></div>
  <div class="bg-reel right"></div>
  <div class="bg-reel mid-left"></div>
  <div class="bg-reel mid-right"></div>
  <div class="bg-neon top"></div>
  <div class="bg-neon bottom"></div>
  <svg class="bg-graph" viewBox="0 0 1080 280" preserveAspectRatio="none">
    <path class="gv-neutral" d="__GRAPH_PATH_NEUTRAL__" />
    <path class="gv-up" d="__GRAPH_PATH_UP__" />
    <path class="gv-down" d="__GRAPH_PATH_DOWN__" />
  </svg>
  <div class="bg-digits">__DIGITS_HTML__</div>
  <div class="bg-people" id="bg-people">__PEOPLE_HTML__</div>
  <div class="dim-overlay" id="dim-overlay"></div>

  __SCENES_HTML__

  <script>
    function startBackground() {
      var bg = document.querySelectorAll(
        ".bg-glow, .bg-lamp, .bg-reel, .bg-neon, .bg-graph path, .bg-digit"
      );
      bg.forEach(function (el) { el.style.animationPlayState = "running"; });
    }

    function fitLines(root) {
      var safeArea = root.querySelector(".safe-area");
      if (!safeArea) return;
      var maxWidth = safeArea.clientWidth - 40;
      var fits = Array.prototype.slice.call(root.querySelectorAll(".line-fit"));
      fits.forEach(function (fit) {
        fit.style.removeProperty("--fit-scale");
        var natural = fit.scrollWidth;
        if (natural > maxWidth) {
          var scale = (maxWidth / natural) * 0.94;
          fit.style.setProperty("--fit-scale", scale.toFixed(4));
        }
      });
    }

    function pulseOnce(el, scale) {
      if (!el.animate) return;
      el.animate(
        [{ transform: "scale(1)" }, { transform: "scale(" + (scale || 1.14) + ")" }, { transform: "scale(1)" }],
        { duration: 260, easing: "ease-out" }
      );
    }

    function runCountUp(el) {
      var target = parseInt(el.dataset.countTo, 10);
      var duration = parseFloat(el.dataset.countDuration || "2.2") * 1000;
      var suffix = el.dataset.countSuffix || "";
      var milestones = (el.dataset.milestones || "")
        .split(",")
        .filter(Boolean)
        .map(Number)
        .sort(function (a, b) { return a - b; });
      var nextMilestoneIdx = 0;
      var start = performance.now();
      function frame(now) {
        var t = Math.min(1, (now - start) / duration);
        var eased = 1 - Math.pow(1 - t, 3);
        var val = Math.round(target * eased);
        el.textContent = val.toLocaleString("ja-JP") + suffix;
        while (nextMilestoneIdx < milestones.length && val >= milestones[nextMilestoneIdx]) {
          pulseOnce(el, 1.1); // light emphasis only -- the real payoff is the arrival scene
          nextMilestoneIdx++;
        }
        if (t < 1) requestAnimationFrame(frame);
        else el.textContent = target.toLocaleString("ja-JP") + suffix;
      }
      requestAnimationFrame(frame);
    }

    function runDigitRoll(el) {
      var final = el.dataset.rollFinal;
      var duration = parseFloat(el.dataset.rollDuration || "0.32") * 1000;
      var start = performance.now();
      var digits = "0123456789";
      function randomized() {
        return final.replace(/[0-9]/g, function () {
          return digits[(Math.random() * 10) | 0];
        });
      }
      function frame(now) {
        var elapsed = now - start;
        if (elapsed < duration) {
          el.textContent = randomized();
          requestAnimationFrame(frame);
        } else {
          el.textContent = final;
        }
      }
      requestAnimationFrame(frame);
    }

    // 80,000,000G -> 8000万G. Re-fits the line afterwards since the
    // swapped text is a very different width.
    function runSwap(el, sceneEl) {
      var to = el.dataset.swapTo;
      if (!to) return;
      el.textContent = to;
      var varsRaw = el.dataset.swapVars;
      if (varsRaw) {
        varsRaw.split(";").forEach(function (decl) {
          var idx = decl.indexOf(":");
          if (idx > -1) el.parentElement.style.setProperty(decl.slice(0, idx), decl.slice(idx + 1));
        });
      }
      pulseOnce(el, 1.18);
      fitLines(sceneEl);
    }

    function triggerScene(sceneEl) {
      if (sceneEl.dataset.triggered === "1") return;
      sceneEl.dataset.triggered = "1";
      sceneEl.classList.add("zoomed");
      var els = sceneEl.querySelectorAll(
        ".line, .pop-normal, .pop-strong, .pop-hero, .pop-mega, .pop-smooth, .glow-burst, .glow-burst-mega, " +
        ".jagumi-img, .jagumi-bob, .jg-qmark, .jg-point-spark"
      );
      els.forEach(function (el) { el.style.animationPlayState = "running"; });

      var decor = sceneEl.querySelector(".decor-layer");
      if (decor) decor.classList.add("on");

      var shakeEls = sceneEl.querySelectorAll("[data-shake]");
      shakeEls.forEach(function (el) {
        var delay = parseFloat(el.dataset.shake || "0") * 1000;
        var isJagumi = el.classList.contains("jagumi-img");
        setTimeout(function () {
          if (isJagumi) {
            var slot = el.closest(".jagumi-slot");
            if (slot) slot.classList.add("jg-shake");
          } else {
            sceneEl.classList.add("impact-shake");
          }
        }, delay);
      });

      var rollEls = sceneEl.querySelectorAll("[data-roll-final]");
      rollEls.forEach(function (el) {
        var delay = parseFloat(el.dataset.rollDelay || "0") * 1000;
        setTimeout(function () { runDigitRoll(el); }, delay);
      });

      var countEls = sceneEl.querySelectorAll("[data-count-to]");
      countEls.forEach(function (el) {
        var delay = parseFloat(el.dataset.countDelay || "0") * 1000;
        setTimeout(function () { runCountUp(el); }, delay);
      });

      var swapEls = sceneEl.querySelectorAll("[data-swap-to]");
      swapEls.forEach(function (el) {
        var delay = parseFloat(el.dataset.swapDelay || "0.5") * 1000;
        setTimeout(function () { runSwap(el, sceneEl); }, delay);
      });
    }

    var CROSSFADE = 0.1; // seconds -- tight cuts for the faster V6 edit pace
    var sceneEls = Array.prototype.slice.call(document.querySelectorAll(".scene"));
    var scenes = sceneEls.map(function (el) {
      return {
        el: el,
        start: parseFloat(el.dataset.start),
        end: parseFloat(el.dataset.end),
        dim: el.dataset.effectDim === "1",
        reelTurbo: el.dataset.effectReelTurbo === "1",
        reelStop: el.dataset.effectReelStop === "1",
        graphFreeze: el.dataset.effectGraphFreeze === "1",
        neonRed: el.dataset.effectNeonRed === "1",
        digitsBurst: el.dataset.effectDigitsBurst === "1",
        calm: el.dataset.effectCalm === "1",
        peopleGrid: el.dataset.effectPeopleGrid === "1",
        graphVariant: el.dataset.effectGraphVariant || "",
      };
    });

    function opacityFor(start, end, t) {
      if (t <= start || t >= end) return 0;
      var fadeIn = Math.min(1, (t - start) / CROSSFADE);
      var fadeOut = Math.min(1, (end - t) / CROSSFADE);
      return Math.min(fadeIn, fadeOut, 1);
    }

    var dimOverlay = document.getElementById("dim-overlay");
    var peopleGrid = document.getElementById("bg-people");
    var graphPaths = {
      neutral: document.querySelector(".bg-graph path.gv-neutral"),
      up: document.querySelector(".bg-graph path.gv-up"),
      down: document.querySelector(".bg-graph path.gv-down"),
    };

    function applySceneEffects(active) {
      document.body.classList.toggle("reel-turbo", !!(active && active.reelTurbo));
      document.body.classList.toggle("reel-stop", !!(active && active.reelStop));
      document.body.classList.toggle("graph-freeze", !!(active && active.graphFreeze));
      document.body.classList.toggle("neon-red", !!(active && active.neonRed));
      document.body.classList.toggle("digits-burst", !!(active && active.digitsBurst));
      document.body.classList.toggle("calm", !!(active && active.calm));
      dimOverlay.style.opacity = active && active.dim ? "0.55" : "0";
      peopleGrid.style.opacity = active && active.peopleGrid ? "1" : "0";
      var variant = (active && active.graphVariant) || "neutral";
      Object.keys(graphPaths).forEach(function (key) {
        graphPaths[key].style.opacity = key === variant ? "0.9" : "0";
      });
    }

    var t0 = null;
    function tick(now) {
      if (t0 === null) return;
      var t = (now - t0) / 1000;
      var active = null;
      scenes.forEach(function (s) {
        if (t >= s.start - 0.015) triggerScene(s.el);
        s.el.style.opacity = opacityFor(s.start, s.end, t).toFixed(4);
        if (t >= s.start && t < s.end) active = s;
      });
      applySceneEffects(active);
      requestAnimationFrame(tick);
    }

    function startAll() {
      scenes.forEach(function (s) { fitLines(s.el); });
      startBackground();
      t0 = performance.now();
      document.documentElement.setAttribute("data-started", "1");
      requestAnimationFrame(tick);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        requestAnimationFrame(function () { requestAnimationFrame(startAll); });
      });
    } else {
      startAll();
    }
  </script>
</body>
</html>
