<!doctype html>
<html lang="ja" style="background:#05050a">
<head>
<meta charset="utf-8" />
<title>scene-v2</title>
<style>
  @font-face {
    font-family: "NotoSansJP-Bold";
    src: url("__FONT_BOLD_URL__") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "NotoSansJP-Black";
    src: url("__FONT_BLACK_URL__") format("woff2");
    font-weight: 900;
    font-display: block;
  }

  :root {
    --bg-1: #14141c;
    --bg-2: #05050a;
    --fg: #eef0f5;
    --fg-dim: #9aa0b4;
    --gold-1: #ffe9a8;
    --gold-2: #ffb300;
    --glow: rgba(255, 191, 71, 0.45);
    --caution: #ffb37a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg-2);
  }

  body {
    position: relative;
    font-family: "NotoSansJP-Bold", "Noto Sans CJK JP", sans-serif;
  }

  /* ---------- background: slow gradient drift ---------- */
  .bg-glow {
    position: absolute;
    inset: -20%;
    background: radial-gradient(ellipse 900px 900px at 50% 36%, var(--bg-1) 0%, var(--bg-2) 68%);
    animation: drift 22s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  @keyframes drift {
    0%   { transform: translate(-1.5%, -1%) scale(1.02); }
    100% { transform: translate(1.5%, 1.5%) scale(1.06); }
  }

  /* faint data-analysis grid lines */
  .bg-grid {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image:
      repeating-linear-gradient(0deg, var(--fg) 0px, var(--fg) 1px, transparent 1px, transparent 160px),
      repeating-linear-gradient(90deg, var(--fg) 0px, var(--fg) 1px, transparent 1px, transparent 160px);
  }

  /* slow vertical scan line, evokes "reading" data */
  .bg-scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 340px;
    background: linear-gradient(180deg, transparent, rgba(255, 200, 90, 0.05) 45%, rgba(255, 200, 90, 0.09) 50%, rgba(255, 200, 90, 0.05) 55%, transparent);
    animation: scan 13s linear infinite;
    animation-play-state: paused;
  }
  @keyframes scan {
    0%   { transform: translateY(-380px); }
    100% { transform: translateY(1920px); }
  }

  .bg-particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 130, 0.9), rgba(255, 214, 130, 0));
    animation-name: rise;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-play-state: paused;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(0.8); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateY(-1650px) scale(1.1); opacity: 0; }
  }

  body::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 260px 40px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }

  /* ---------- foreground content ---------- */
  .safe-area {
    position: absolute;
    left: 90px;
    right: 90px;
    top: 300px;
    bottom: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--line-gap, 40px);
  }

  .scene-root {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(1.035);
    animation: sceneEnter 0.55s ease-out forwards;
    animation-play-state: paused;
  }
  @keyframes sceneEnter {
    to { opacity: 1; transform: scale(1); }
  }

  .line {
    display: flex;
    justify-content: center;
    opacity: 0;
    animation: lineFade 0.4s ease-out forwards;
    animation-play-state: paused;
  }
  @keyframes lineFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .line.enter-fadeUp {
    animation-name: lineFadeUp;
  }
  @keyframes lineFadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* inner wrapper: carries the "shrink to fit" scale so it never fights
     the outer .line's own fade/fadeUp transform animation */
  .line-fit {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 28px;
    white-space: nowrap;
    line-height: 1.15;
    transform-origin: center;
    transform: scale(var(--fit-scale, 1));
  }

  .role-label {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-label, 66px);
    color: var(--fg);
    letter-spacing: 2px;
  }

  .role-heading {
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-heading, 84px);
    color: var(--fg);
    letter-spacing: 1px;
  }

  .role-accent {
    display: inline-block;
    font-family: "NotoSansJP-Black", sans-serif;
    font-weight: 900;
    font-size: var(--fs-accent, 150px);
    background: linear-gradient(180deg, var(--gold-1) 10%, var(--gold-2) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 46px var(--glow);
    letter-spacing: 1px;
  }

  .role-tag {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-tag, 50px);
    color: var(--fg-dim);
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    padding: 10px 30px;
    letter-spacing: 1px;
  }

  .role-note {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-note, 54px);
    color: var(--fg-dim);
    letter-spacing: 1px;
  }

  .role-caution {
    font-family: "NotoSansJP-Bold", sans-serif;
    font-weight: 700;
    font-size: var(--fs-caution, 46px);
    color: var(--caution);
    letter-spacing: 1px;
  }

  /* number pop-in: small -> brief overshoot -> settle */
  .pop-normal, .pop-strong, .pop-hero {
    display: inline-block;
    opacity: 0;
    animation-fill-mode: forwards;
    animation-play-state: paused;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }
  .pop-normal {
    animation-name: popNormal;
    animation-duration: 0.5s;
  }
  .pop-strong {
    animation-name: popStrong;
    animation-duration: 0.6s;
  }
  .pop-hero {
    animation-name: popHero;
    animation-duration: 0.7s;
  }
  @keyframes popNormal {
    0%   { opacity: 0; transform: scale(0.86); }
    60%  { opacity: 1; transform: scale(1.09); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popStrong {
    0%   { opacity: 0; transform: scale(0.8); }
    55%  { opacity: 1; transform: scale(1.16); }
    80%  { transform: scale(0.97); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes popHero {
    0%   { opacity: 0; transform: scale(0.74); }
    50%  { opacity: 1; transform: scale(1.22); }
    75%  { transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* soft glow burst behind strong/hero numbers */
  .glow-burst {
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow), transparent 70%);
    opacity: 0;
    transform: scale(0.5);
    animation-name: burst;
    animation-duration: 0.7s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    animation-play-state: paused;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes burst {
    0%   { opacity: 0; transform: scale(0.5); }
    35%  { opacity: 0.9; }
    100% { opacity: 0; transform: scale(1.5); }
  }

  .accent-wrap { position: relative; display: inline-block; }

  /* ---------- slump graph ---------- */
  .graph-wrap {
    opacity: 0;
    animation: lineFade 0.5s ease-out forwards;
    animation-play-state: paused;
  }
  .slump-graph-line {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: drawLine 1.1s ease-out forwards;
    animation-play-state: paused;
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }
  .slump-graph-dot {
    opacity: 0;
    animation: popNormal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 1.0s;
    animation-play-state: paused;
    transform-origin: center;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div class="bg-scan"></div>
  <div class="bg-particles">__PARTICLES_HTML__</div>

  <div class="scene-root" id="scene-root">
    <div class="safe-area" id="safe-area">__LINES_HTML__</div>
  </div>

  <script>
    // Every animated element starts paused. Once fonts are ready we flip
    // them all to "running" in the same frame, so the recorded video's
    // timeline matches scene.duration exactly (no font-load jitter).
    function startAnimations() {
      var els = document.querySelectorAll(
        ".bg-glow, .bg-scan, .particle, .scene-root, .line, .pop-normal, .pop-strong, .pop-hero, " +
        ".glow-burst, .graph-wrap, .slump-graph-line, .slump-graph-dot"
      );
      els.forEach(function (el) {
        el.style.animationPlayState = "running";
      });
      document.documentElement.setAttribute("data-started", "1");
    }

    function fitLines() {
      var safeArea = document.getElementById("safe-area");
      var maxWidth = safeArea.clientWidth;
      var fits = Array.prototype.slice.call(document.querySelectorAll(".line-fit"));
      fits.forEach(function (fit) {
        var natural = fit.scrollWidth;
        if (natural > maxWidth) {
          var scale = (maxWidth / natural) * 0.96;
          fit.style.setProperty("--fit-scale", scale.toFixed(4));
        }
      });
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        fitLines();
        requestAnimationFrame(function () {
          requestAnimationFrame(startAnimations);
        });
      });
    } else {
      fitLines();
      startAnimations();
    }
  </script>
</body>
</html>
