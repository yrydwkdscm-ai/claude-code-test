<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>サイコロアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <p class="eyebrow">SIMPLE DICE</p>
      <h1>サイコロアプリ</h1>
      <p class="lead">ボタンを押して、今日の運を試してみよう。</p>
    </header>

    <section class="dice-card" aria-label="サイコロの結果">
      <p class="result-label">出た目</p>
      <div class="dice" id="dice" aria-live="polite" aria-atomic="true">
        <span id="dice-number">?</span>
      </div>
      <p class="hint">1〜6の数字が表示されます</p>
    </section>

    <button id="roll-button" type="button">
      <span aria-hidden="true">🎲</span>
      サイコロを振る
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
